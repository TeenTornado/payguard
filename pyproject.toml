[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payguard"
version = "0.1.0"
description = "AI payment-integration defect detector and verifier for Razorpay"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    # data
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    # analysis
    "tree-sitter==0.23.2",
    "tree-sitter-language-pack==0.7.1",
    # ml
    "scikit-learn==1.6.0",
    "numpy==2.2.0",
    # llm
    "anthropic==0.45.0",
    "openai==1.59.7",
    # logging
    "structlog==24.4.0",
    # utils
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "click==8.1.8",
    "rich==13.9.4",
    "tenacity==9.0.0",
    "razorpay==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.0",
    "types-pyyaml==6.0.12.20240917",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    # gitleaks installed via brew/binary, not pip
]

[project.scripts]
payguard = "payguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["payguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]  # assert in tests ok; FastAPI Depends() pattern ok

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_language_pack.*", "sklearn.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
